services:
  postgres:
    image: postgres:16-alpine
    container_name: takumi-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: takumi
    ports:
      - "5432:5432"
    volumes:
      - takumi-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d takumi"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  takumi-postgres-data:
